/* The illustration remains intact; all living elements are independent overlays. */
.illustration-inner{isolation:isolate}
.map-art{position:relative;z-index:0}
.forest-shimmer{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.35;
  background:radial-gradient(ellipse at 49% 76%,#b8ff7660 0%,transparent 24%),radial-gradient(circle at 61% 49%,#ffe3a628 0%,transparent 18%);
  mix-blend-mode:screen;animation:forestBreath 8s ease-in-out infinite alternate}

.firefly{position:absolute;left:var(--x);top:var(--y);z-index:3;pointer-events:none;width:clamp(2px,.4vw,5px);height:clamp(2px,.4vw,5px);border-radius:50%;background:#fff4b4;
  box-shadow:0 0 5px 2px #ffea8b,0 0 19px 5px #f4d45a99;animation:fireflyFloat 6s ease-in-out var(--delay) infinite alternate;opacity:.25}
@keyframes fireflyFloat{0%{opacity:.12;transform:translate(0,6px) scale(.6)}48%{opacity:.95;transform:translate(3px,-4px) scale(1.2)}100%{opacity:.35;transform:translate(-4px,-9px) scale(.8)}}

  line-height:1;display:grid;place-items:center;filter:drop-shadow(0 1px 1px #173e1b) drop-shadow(0 0 5px #d7ff7c);animation:leafAppear .85s cubic-bezier(.2,1.6,.3,1) both,leafSway 6s ease-in-out 1s infinite alternate;
  animation-delay:var(--leaf-delay),calc(var(--leaf-delay) + 1s)}
.magic-leaf.blossomed{font-family:Georgia,serif;color:#ffe3bd;font-size:clamp(19px,2.6vw,34px);text-shadow:0 0 3px #e75588,0 0 8px #ed8bc8,0 0 13px #fff5ba}

@keyframes leafSway{0%{transform:translate(-50%,-50%) rotate(calc(var(--leaf-rot) - 8deg))}100%{transform:translate(-50%,-50%) rotate(calc(var(--leaf-rot) + 8deg))}}

    {q:'Tu écoutes le document pour la première fois',strategy:'Compréhension globale avant compréhension détaillée',tips:["Avant d’écouter, regarde s’il y a un titre, une image ou une consigne : ils annoncent le thème.","Lors de la première écoute, ne cherche pas à tout comprendre : repère le thème général et le type de document.","Compte le nombre de personnes qui parlent et repère leur ton : joyeux, surpris, énervé…","N’interromps pas tout de suite l’audio ; laisse-toi porter par le sens global.","Note en français quelques mots sur ce que tu as compris avant de recommencer."],hint:'Comprendre l’ambiance générale d’abord permet de mieux comprendre les détails ensuite.',action:'Écoute une fois sans pause, puis écris trois mots-clés.'},
    {q:'Tu dois répondre à des questions précises sur l’audio',strategy:'Écoute sélective (repérage ciblé)',tips:["Lis toutes les questions avant de réécouter : elles indiquent ce qu’il faut repérer.","Pour chaque question, identifie le type d’information à chercher : chiffre, lieu, nom, date…","Réécoute en te concentrant sur une information demandée à la fois.","Si tu rates une information, continue : tu pourras y revenir à la prochaine écoute.","Réponds avec les mots entendus quand c’est possible plutôt que d’inventer."],hint:'Une question = un objectif d’écoute. Ne cherche pas tout en même temps.',action:'Choisis une question et souligne le type d’information à écouter.'},
    {q:'Tu ne reconnais pas certains mots que tu entends',strategy:'Tolérance à l’incompréhension partielle',tips:["Ne pas comprendre chaque mot est normal : vise d’abord le sens global.","Concentre-toi sur les mots connus autour du mot inconnu.","Repère les mots qui ressemblent au français (mots transparents).","Utilise l’intonation et le ton pour interpréter l’intention.","Note le mot mystérieux et cherche-le après l’écoute, si nécessaire."],hint:'Un mot inconnu ne bloque pas la compréhension globale : le contexte suffit souvent.',action:'Repère trois mots connus autour d’un mot inconnu.'},
    {q:'Tu dois prendre des notes en écoutant',strategy:'Prise de notes sélective',tips:["Note des mots-clés et des chiffres, pas des phrases complètes.","Utilise des abréviations ou des symboles faciles à relire (+, ≠, →…).","Laisse de l’espace entre tes notes pour compléter à la deuxième écoute.","Choisis les informations utiles à la consigne plutôt que de tout transcrire."],hint:'Prendre des notes efficaces, c’est trier l’information, pas tout transcrire.',action:'Trace trois colonnes : personnes, lieux, faits.'}
   ]},
  {id:'ce',code:'CE',en:'Reading',name:'Lire et comprendre un texte',icon:'📖',color:'#588365',
   check:'As-tu repéré le titre et le type de texte ?',help:'Observe le document avant de lire : un titre, une image et la mise en page fournissent déjà des indices.',
   stations:[
    {q:'Tu découvres le texte pour la première fois',strategy:'Anticipation par les indices paratextuels',tips:["Observe le titre, les images, la mise en page, la source et l’auteur.","Utilise ces indices pour deviner le thème et le type de texte.","Fais une première lecture rapide sans t’arrêter sur chaque mot inconnu.","Identifie le genre : article, lettre, publicité, récit…","Résume en une phrase ce que tu as compris globalement."],hint:'Un texte se comprend souvent avant même d’être lu, grâce à ce qui l’entoure.',action:'Observe le titre et les images, puis prédis le sujet en une phrase.'},
    {q:'Tu dois répondre à des questions de compréhension',strategy:'Lecture de repérage (balayage ciblé)',tips:["Lis les questions avant de relire le texte.","Repère les mots de la question ou leurs synonymes dans le document.","Recherche la phrase ou le paragraphe qui contient les indices utiles.","Réponds par une phrase complète en réutilisant le vocabulaire du texte.","Pour une opinion ou un sentiment, cherche les mots exprimant une émotion."],hint:'Pour une question factuelle, appuie-toi sur des indices précis du texte.',action:'Choisis une question puis retrouve deux indices dans le texte.'},
    {q:'Le texte contient beaucoup de mots inconnus',strategy:'Inférence lexicale par le contexte',tips:["Ne cherche pas tous les mots dans le dictionnaire : conserve le fil de ta lecture.","Observe les mots et les phrases autour du mot difficile.","Repère les mots transparents proches du français.","Utilise les familles de mots, préfixes et suffixes connus.","Cherche dans le dictionnaire les seuls mots indispensables à la tâche."],hint:'Un bon lecteur utilise le contexte pour déduire une partie du sens.',action:'Entoure un mot inconnu et souligne ses deux indices voisins.'},
    {q:'Tu dois donner ton avis ou interpréter le texte',strategy:'Lecture inférentielle',tips:["Distingue ce que le texte dit explicitement et ce qu’il suggère.","Appuie ton avis sur un passage précis.","Utilise : I think that…, In my opinion…, It seems that…","Nuance ta réponse si le texte peut être interprété de plusieurs façons."],hint:'Une interprétation solide s’appuie sur un indice du texte.',action:'Écris « I think… because… » en citant un indice.'}
   ]},
  {id:'ee',code:'EE',en:'Writing',name:'Rédiger un texte',icon:'✏️',color:'#ba7156',
   check:'As-tu compris qui écrit, pour qui et pourquoi ?',help:'Relis la consigne. Souligne le destinataire, le but du texte et le temps attendu.',
   stations:[
    {q:'Tu n’as pas encore commencé',strategy:'Analyse de la consigne et planification',tips:["Relis la consigne deux fois : qui écrit ? à qui ? pourquoi ? avec quel temps ?","Identifie le type de texte demandé : courriel, dialogue, récit, description…","Note brièvement tes idées au brouillon sans rédiger de longues phrases.","Organise les idées dans un ordre logique.","Prépare quelques mots ou expressions utiles.","Commence par la phrase la plus simple à écrire."],hint:'Un texte simple et clair permet de transmettre efficacement ses idées.',action:'Note trois idées en mots-clés avant d’écrire ta première phrase.'},
    {q:'Tu es bloqué(e) au milieu d’une phrase',strategy:'Simplification et reformulation',tips:["Clarifie l’idée que tu veux exprimer puis reformule-la avec de l’anglais que tu connais.","Vérifie le temps : maintenant, avant ou après ?","Remplace les structures inconnues par des constructions plus simples.","Cherche un mot isolé dans un dictionnaire si tu en as besoin.","Découpe une phrase trop longue en deux phrases courtes.","Continue le texte puis reviens sur ce passage à la relecture."],hint:'Une phrase courte et compréhensible vaut mieux qu’une phrase inutilement compliquée.',action:'Réécris ta phrase en deux phrases courtes.'},
    {q:'Tu as fini, il faut te relire',strategy:'Révision ciblée (un point à la fois)',tips:["Vérifie que chaque phrase a un sujet et un verbe conjugué.","Au présent, as-tu pensé au -s avec he / she / it ?","Le pronom I prend toujours une majuscule.","Vérifie majuscules, ponctuation et accords pertinents.","Relis ton texte à voix basse pour repérer les maladresses.","Vérifie que la consigne, la longueur et le destinataire sont respectés."],hint:'Une relecture point par point est plus efficace qu’une vérification trop rapide.',action:'Relis ton texte en cherchant uniquement les verbes.'},
    {q:'Ton texte est correct, tu veux l’améliorer',strategy:'Enrichissement lexical et syntaxique',tips:["Remplace un mot très répété par un synonyme adapté.","Ajoute quelques connecteurs : first, then, however, because, so…","Varie la longueur des phrases sans les rendre artificiellement complexes.","Ajoute un détail, une émotion ou une opinion pour enrichir ton propos."],hint:'Commence par la justesse, puis enrichis ton texte progressivement.',action:'Ajoute deux connecteurs logiques à ton texte.'}
   ]},
  {id:'eoc',code:'EOC',en:'Speaking',name:'Parler seul(e) : exposé, présentation',icon:'🎙️',color:'#9672a5',
   check:'As-tu préparé quelques mots-clés au lieu d’un texte entier ?',help:'Écris trois idées fortes et une phrase d’ouverture. Elles serviront de repères à l’oral.',
   stations:[
    {q:'Tu dois préparer un exposé ou une présentation',strategy:'Planification par mots-clés',tips:["Prépare un plan avec des mots-clés plutôt qu’un texte à apprendre par cœur.","Structure ton propos avec first, then, next, finally…","Prévois une phrase d’accroche et une conclusion.","Utilise des fiches ou des images plutôt qu’un texte complet à lire.","Chronomètre-toi pour respecter le temps demandé."],hint:'Des mots-clés rendent l’oral plus naturel et aident à se retrouver en cas d’hésitation.',action:'Prépare trois mots-clés pour chaque partie de ton exposé.'},
    {q:'Tu dois t’enregistrer (audio ou vidéo)',strategy:'Entraînement par répétitions successives',tips:["Entraîne-toi plusieurs fois à voix haute avant de t’enregistrer.","Réalise un essai pour repérer les passages difficiles.","Articule et ralentis légèrement si tu parles trop vite.","Travaille l’intonation des questions et des affirmations.","Recommence les passages difficiles sans nécessairement tout refaire."],hint:'Un oral clair et intelligible est plus utile qu’un oral récité trop vite.',action:'Enregistre trente secondes et repère un point à améliorer.'},
    {q:'Tu as le trac, peur de parler',strategy:'Prendre confiance à l’oral',tips:["Une erreur ne t’empêche pas de communiquer.","Respire calmement avant de commencer.","Commence par l’idée que tu maîtrises le mieux.","Accepte les pauses et les hésitations : elles font partie de la parole.","Concentre-toi sur ton message plutôt que sur la perfection de chaque mot."],hint:'Le but de l’oral, c’est d’être compris, pas d’être parfait.',action:'Dis à voix haute une première phrase que tu connais bien.'},
    {q:'Tu dois décrire une image ou une peinture',strategy:'Description structurée : plans et vocabulaire',tips:["Commence par « This picture shows… » ou « In this picture, we can see… ».","Décris d’abord le premier plan (foreground), puis l’arrière-plan (background).","Décris les personnages, le lieu, les couleurs et les actions.","Utilise there is/are et, si besoin, le présent en -ing.","Situe les éléments : on the left, in the middle, in the background.","Décris objectivement avant de proposer une interprétation."],hint:'Suivre le même ordre aide à organiser ta pensée et ton discours.',action:'Décris trois éléments de l’image avec leur position.'},
    {q:'Tu dois analyser une peinture ou une œuvre d’art',strategy:'Décrire, interpréter, contextualiser',tips:["1. Décris objectivement la composition, les couleurs, les personnes, la lumière.","2. Interprète l’effet que l’œuvre produit et explique pourquoi.","3. Relie l’œuvre à son contexte si tu le connais.","Utilise « this painting represents… », « it seems to suggest… ».","Justifie tes interprétations avec un détail visible.","Si la consigne le permet, compare avec une autre image étudiée."],hint:'Une interprétation gagne en force lorsqu’elle s’appuie sur un détail visible.',action:'Choisis un détail et complète : « It suggests… because… ».'},
    {q:'Tu dois présenter une image à l’oral (exposé, épreuve)',strategy:'Structuration de la présentation orale',tips:["Prépare trois parties : vue d’ensemble, détails, interprétation ou avis.","Utilise des mots-clés plutôt qu’un texte appris par cœur.","Entraîne-toi en regardant l’image pendant que tu parles.","Prépare des transitions : Now, let’s look at… / This leads me to think that…","Termine par un avis ou un lien avec le thème étudié."],hint:'Avance du général vers le particulier, puis vers ton interprétation.',action:'Chronomètre une présentation de l’image en trois parties.'}
   ]},
  {id:'eoi',code:'EOI',en:'Interaction',name:'Parler à quelqu’un : dialogue, échange',icon:'💬',color:'#49939b',
   check:'As-tu prévu comment poser une question ET y répondre ?',help:'Prépare une amorce pour commencer, une question pour relancer et une formule pour conclure.',
   stations:[
    {q:'Tu dois préparer un dialogue ou un jeu de rôle',strategy:'Anticipation des échanges',tips:["Identifie qui sont les personnes et ce qu’elles veulent obtenir.","Prépare des phrases pour commencer, réagir et conclure.","Prévois des questions ET des réponses.","Garde quelques expressions pour demander une reformulation.","Entraîne-toi ensemble, pas seulement chacun de son côté."],hint:'Une interaction rebondit sur ce que dit l’autre : ce n’est pas une récitation.',action:'Imagine deux répliques différentes à une même question.'},
    {q:'Tu dois réagir à l’oral en classe',strategy:'Réaction immédiate et prise de risque',tips:["Commence par une réponse simple plutôt que d’attendre la phrase parfaite.","Réutilise les mots de la question pour construire ta réponse.","Si un mot manque, utilise un synonyme ou décris l’idée.","Une réponse brève peut être parfaitement pertinente.","Écoute la question jusqu’au bout."],hint:'Oser prendre la parole aide à progresser, même si la phrase n’est pas parfaite.',action:'Réponds à une question en une seule phrase simple.'},
    {q:'Tu ne comprends pas ce qu’on te dit ou te demande',strategy:'Stratégies de négociation du sens',tips:["Demande de répéter : « Can you repeat, please? »","Demande de reformuler : « Can you say that in another way? »","Demande de ralentir : « Can you speak more slowly, please? »","Dis « Sorry, I don’t understand » plutôt que de répondre au hasard.","Vérifie ce que tu as compris : « Do you mean…? »"],hint:'Savoir demander de l’aide à l’oral est une compétence à part entière.',action:'Dis à voix haute deux expressions pour demander de l’aide.'}
   ]},
  {id:'mediation',code:'Médiation',en:'Mediation',name:'Expliquer, résumer ou transmettre',icon:'🔄',color:'#a18a4f',
   check:'As-tu repéré ce qui est indispensable pour ton destinataire ?',help:'Note les informations essentielles : qui, quoi, où, quand, pourquoi ; écarte le superflu.',
   stations:[
    {q:'Tu dois résumer ou expliquer un document à quelqu’un',strategy:'Reformulation de l’essentiel',tips:["Identifie les informations essentielles : qui, quoi, où, quand, pourquoi.","Laisse de côté les détails secondaires.","Explique avec tes propres mots, parfois plus simples.","Adapte tes explications à la personne à qui tu t’adresses.","Vérifie que la personne a bien compris."],hint:'Médier, ce n’est pas tout redire : c’est transmettre l’essentiel.',action:'Résume le document en trois idées importantes.'},
    {q:'Tu dois transmettre un message d’une langue à l’autre',strategy:'Traduction fonctionnelle : le sens, pas le mot à mot',tips:["Comprends le sens global avant de reformuler.","Transmets l’intention, pas chaque mot littéralement.","Adapte les expressions idiomatiques et les références utiles.","Conserve exactement les chiffres, noms, lieux et dates.","Vérifie que ton message permet à l’autre d’agir ou de répondre."],hint:'Une bonne médiation privilégie le sens plutôt que le mot à mot.',action:'Écris l’idée centrale du message avec tes propres mots.'}
   ]},
  {id:'stuck',code:'SOS',en:'SOS',name:'Je suis complètement bloqué(e)',icon:'🛟',color:'#b96965',
   check:'Peux-tu identifier précisément ce qui te bloque ?',help:'Écris une question très précise : « Je ne sais pas comment… » ou « Je ne comprends pas… »',
   stations:[
    {q:'Quelle que soit l’activité, avant d’abandonner',strategy:'Plan de secours en cinq étapes',tips:["Relis la consigne calmement, phrase par phrase.","Cherche un exemple proche dans ton cahier ou ton manuel.","Commence par la partie que tu peux réaliser, même si elle est petite.","Note une question précise à poser en classe.","Si le problème est technique ou si tu as besoin d’aide, parle à un adulte de confiance."],hint:'Une tentative, même incomplète, te permet de mieux comprendre ce qu’il te reste à apprendre.',action:'Écris ta question précise sur une feuille ou dans ton cahier.'}
   ]}
];

</script>
<script>
(function(){
'use strict';
const DATA=window.TREE_DATA;
const main=document.getElementById('app');
const modalRoot=document.getElementById('modal-root');
const toastRoot=document.getElementById('toast-root');
const STORAGE='brot2you-arbre-enchanted-v1';
const validKeys=new Set(DATA.flatMap(cat=>cat.stations.map((s,i)=>cat.id+':'+i)));
const state={page:'home',cat:null,index:null,history:[],check:null,filter:'all',settingsOpen:false,ollieHint:0,bookPage:0,wisdomDraft:null,
 data:{saved:[],tried:{},sound:false,reduced:false,bookChecks:{},bookNotes:{},diagnostic:{},miniAnswers:{}},newestLeaf:null};
let audioContext;
function load(){try{const value=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!value||typeof value!=='object')return;
state.data.saved=Array.isArray(value.saved)?value.saved.filter(x=>validKeys.has(x)):[];
state.data.tried=value.tried && typeof value.tried==='object'?Object.fromEntries(Object.entries(value.tried).filter(([k,v])=>validKeys.has(k)&&['tried','helpful','needhelp'].includes(v))):{};
state.data.sound=!!value.sound;state.data.reduced=!!value.reduced;state.data.bookChecks=value.bookChecks&&typeof value.bookChecks==='object'?Object.fromEntries(Object.entries(value.bookChecks).filter(([k,v])=>validKeys.has(k)&&Array.isArray(v)).map(([k,v])=>[k,[...new Set(v.filter(n=>Number.isInteger(n)&&n>=0&&n<10))]])):{};state.data.bookNotes=value.bookNotes&&typeof value.bookNotes==='object'?Object.fromEntries(Object.entries(value.bookNotes).filter(([k,v])=>validKeys.has(k)&&typeof v==='string').map(([k,v])=>[k,v.slice(0,300)])):{};
state.data.diagnostic=value.diagnostic&&typeof value.diagnostic==='object'?Object.fromEntries(Object.entries(value.diagnostic).filter(([id,v])=>{const c=catById(id);return c&&v&&Number.isInteger(v.index)&&v.index>=0&&v.index<c.stations.length&&['start','trying','alternative'].includes(v.level)}).map(([id,v])=>[id,{index:v.index,level:v.level}])):{};
state.data.miniAnswers=value.miniAnswers&&typeof value.miniAnswers==='object'?Object.fromEntries(Object.entries(value.miniAnswers).filter(([k,v])=>validKeys.has(k)&&Number.isInteger(v)&&v>=0&&v<=2)):{};}catch(e){}}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state.data))}catch(e){toast('La sauvegarde locale est indisponible sur cet appareil.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function catById(id){return DATA.find(c=>c.id===id)}
function key(id,i){return id+':'+i}
function saved(id,i){return state.data.saved.includes(key(id,i))}
function status(id,i){return state.data.tried[key(id,i)]||null}
function stats(){const attempt=Object.keys(state.data.tried).length;const useful=Object.values(state.data.tried).filter(v=>v==='helpful').length;return {attempt,useful,fav:state.data.saved.length}}
// V3 : un progrès = une stratégie réellement essayée ; l'efficacité est indiquée par une fleur.
const GROWTH=[
 {at:0,title:'La graine des possibles',motto:'Chaque grande découverte commence par une question.',icon:'🌰'},
 {at:1,title:'Les premières pousses',motto:'Tes premiers essais donnent vie à l’arbre.',icon:'🌱'},
 {at:6,title:'Les branches s’éveillent',motto:'Tu enrichis peu à peu ta boîte à stratégies.',icon:'🍃'},
 {at:12,title:'La canopée prend vie',motto:'Tu connais déjà plusieurs chemins pour avancer.',icon:'🌳'},
 {at:20,title:'L’arbre rayonne',motto:'Tu disposes d’un beau répertoire de méthodes.',icon:'✨'}
];
function growth(attempt){let current=0;for(let i=0;i<GROWTH.length;i++)if(attempt>=GROWTH[i].at)current=i;return {current,stage:GROWTH[current],next:GROWTH[current+1]||null}}
function branchStats(c){let tried=0,helpful=0;c.stations.forEach((_,i)=>{const st=status(c.id,i);if(st)tried++;if(st==='helpful')helpful++});return {tried,helpful,total:c.stations.length}}
// Positions tied to the 7 real branches: stable across navigation and reload.
const LEAF_SITES={
 co:[[34,21,-34],[41,23,28],[45,27,68],[48,20,-28]],
 ce:[[55,18,-35],[63,19,25],[70,20,66],[69,26,5]],
 ee:[[88,25,-42],[93,31,25],[92,39,65],[89,51,-12]],
 eoc:[[12,44,-40],[12,55,28],[31,42,65],[10,67,-18],[34,64,17],[22,69,61]],
 eoi:[[39,58,32],[39,73,-24],[46,79,65]],
 mediation:[[66,50,-40],[85,59,50]],
 stuck:[[73,85,-28]]
};
function leafMarkup(){return DATA.flatMap(c=>c.stations.map((_,i)=>{const st=status(c.id,i);if(!st)return '';
 const [x,y,rotate]=LEAF_SITES[c.id][i];const just=state.newestLeaf===key(c.id,i)?' fresh':'';
 return `<span class="magic-leaf${just}${st==='helpful'?' blossomed':''}" style="--leaf-x:${x}%;--leaf-y:${y}%;--leaf-rot:${rotate}deg;--leaf-delay:${(i%4)*.1}s" aria-hidden="true">${st==='helpful'?'✿':'🍃'}</span>`;
 })).join('')}
function fireflyMarkup(){const spots=[[7,23],[48,16],[77,16],[95,38],[11,63],[83,68],[34,73],[96,77],[58,88],[68,43],[42,42]];
 return spots.map(([x,y],i)=>`<span class="firefly" aria-hidden="true" style="--x:${x}%;--y:${y}%;--delay:${i*.39}s"></span>`).join('')}
function treeProgress(){const s=stats(),g=growth(s.attempt);const next=g.next?`${g.next.at-s.attempt} ${g.next.at-s.attempt===1?'nouvelle stratégie essayée':'nouvelles stratégies essayées'} avant la prochaine étape`:'Ton arbre a atteint sa plus grande étape de croissance.';
 return `<section class="growth-panel" aria-label="Évolution de ton arbre"><div class="growth-intro"><span class="growth-icon" aria-hidden="true">${g.stage.icon}</span><div><span class="growth-eyebrow">TON ARBRE VIVANT · ÉTAPE ${g.current+1}/5</span><h2>${g.stage.title}</h2><p>${g.stage.motto}</p></div><div class="growth-total"><strong>${s.attempt}<span>/24</span></strong><small>feuilles poussées</small></div></div><div class="growth-meter" role="progressbar" aria-label="Stratégies essayées" aria-valuenow="${s.attempt}" aria-valuemin="0" aria-valuemax="24"><span style="width:${s.attempt/24*100}%"></span></div><div class="growth-stages">${GROWTH.map((step,i)=>`<span class="growth-stop${i<g.current?' reached':i===g.current?' current':''}" title="À partir de ${step.at} stratégies essayées : ${step.title}"><span aria-hidden="true">${step.icon}</span><small>${step.at===0?'Départ':step.at+(step.at===1?' feuille':' feuilles')}</small></span>`).join('')}</div><p class="growth-next">${g.next?'🌿 '+next:'✨ '+next} · <strong>${s.useful} ${s.useful===1?'fleur':'fleurs'}</strong> pour les stratégies qui t’ont aidé.</p></section>`}

function play(){if(!state.data.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext=audioContext||new AC();let t=audioContext.currentTime;for(const [hz,delay] of [[523,0],[659,.085],[784,.17]]){const o=audioContext.createOscillator();const g=audioContext.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(.04,t+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,t+delay+.26);o.connect(g);g.connect(audioContext.destination);o.start(t+delay);o.stop(t+delay+.27)}}catch(e){}}
function owlMagic(kind='flower'){
 if(state.data.reduced||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
 const layer=document.createElement('div');layer.className='ollie-magic';layer.setAttribute('aria-hidden','true');
 const symbols=kind==='leaf'?['🍃','✦','✧','🍃','✦','✧','🍃','✦']:['🌸','✦','✧','✨','🌸','✧','✦','✨'];
 symbols.forEach((symbol,i)=>{const el=document.createElement('span');el.textContent=symbol;el.style.setProperty('--dx',Math.round(130*Math.cos(i*Math.PI/4))+'px');el.style.setProperty('--dy',Math.round(105*Math.sin(i*Math.PI/4)-80)+'px');el.style.setProperty('--delay',(i*0.035)+'s');layer.appendChild(el)});
 document.body.appendChild(layer);setTimeout(()=>layer.remove(),1850)
}
function toast(message){toastRoot.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(toastRoot.timer);toastRoot.timer=setTimeout(()=>toastRoot.innerHTML='',2800)}

function ollieGuidance(){
 const n=state.ollieHint||0;
 if(state.page==='home'){
  const s=stats();
  const lines=[
   {en:'Welcome to the enchanted tree!',fr:'Choisis une branche dans l’illustration : elle t’aidera à trouver ta propre méthode.',tag:'Bienvenue dans la forêt',mood:'curious'},
   {en:'One little step at a time.',fr:'Quand une tâche paraît difficile, cherche d’abord une toute petite action réalisable.',tag:'Un premier indice',mood:'thinking'},
   {en:'Your effort makes leaves grow!',fr:s.attempt?`Tu as déjà essayé ${s.attempt} stratégie${s.attempt>1?'s':''}. Retrouve-la dans ton carnet quand tu en as besoin.`:'Une feuille pousse quand tu essaies une stratégie. Ce n’est pas une note !',tag:'Ta progression',mood:'proud'}
  ];return lines[n%lines.length]
 }
 if(state.page==='category'){
  const c=catById(state.cat);if(!c)return ollieGuidanceForDefault();
  const lines=[{en:'What is tricky for you?',fr:`Dans la branche ${c.en}, choisis la situation qui ressemble le plus à ta difficulté.`,tag:'Repère ta difficulté',mood:'curious'},
    {en:'Look for clues first.',fr:c.check,tag:'Petite question',mood:'thinking'},
    {en:'Try this simple clue.',fr:c.help,tag:'Une piste pour démarrer',mood:'encourage'}];return lines[n%lines.length]
 }
 if(state.page==='method'){
  const c=catById(state.cat),s=c?.stations[state.index];if(!s)return ollieGuidanceForDefault();
  const st=status(c.id,state.index);
  if(st==='helpful'){
   const lines=[
    {en:'You found your own way!',fr:'Bravo pour cette stratégie qui t’a aidé ! Tu pourras la retrouver dans ton carnet.',tag:'La feuille est en fleur',mood:'celebrate'},
    {en:'Keep this method in mind!',fr:s.hint,tag:'À retenir pour plus tard',mood:'proud'},
    {en:'You can use it again.',fr:'Cette méthode pourra aussi te servir pour un prochain devoir. Tu peux la garder dans tes favoris.',tag:'Réutilise ta stratégie',mood:'encourage'}];
   return lines[n%lines.length]
  }
  if(st==='needhelp'){
   const lines=[
    {en:'Different paths can work.',fr:`C’est normal d’essayer autrement. ${c.help}`,tag:'Essayons un autre chemin',mood:'caring'},
    {en:'Try a smaller step.',fr:s.action,tag:'Revenir à une petite action',mood:'encourage'},
    {en:'Another path is waiting.',fr:'Si cela reste difficile, explore une autre situation de la branche ou la branche SOS.',tag:'Chercher une autre méthode',mood:'thinking'}];
   return lines[n%lines.length]

function wisdomOther(c,i){

}

 return content(`${crumb(c,'Mon grimoire')}<div class="v5-title"><div class="section-tag">✦ THE WISDOM TREE · V7 ✦</div><h2>Le Grimoire des stratégies</h2><p>Trois petits chapitres pour apprendre à apprendre</p></div>
 <div class="wisdom-grimoire-link"><span>🧠 Pas sûr(e) d’avoir choisi la bonne méthode ?</span><button class="btn secondary" data-action="wisdomFromBook" data-cat="${c.id}" data-index="${state.index}">Demander à Ollie</button></div><div class="v5-binding"><div class="v5-spread">
  <section class="v5-left"><small>✧ BROT2YOU · ENGLISH SKILLS ✧</small><div class="v5-owl painted-ollie-wrap" aria-hidden="true">${storybookOllie(p)}</div><small>${esc(c.en)} · ${state.index+1}/${c.stations.length}</small><h3>${esc(s.strategy)}</h3><p class="v5-cover-category">${storybookIcon(c.id)}<span>${esc(c.name)}</span></p>
   <div class="v5-step-one"><strong>🌱 Ton premier petit pas</strong><p>${esc(s.action)}</p></div>
   <button class="star-btn ${fav?'active':''}" data-action="favorite" aria-pressed="${fav}">${fav?'★ Dans mon carnet':'☆ Garder dans mon carnet'}</button>
   <div class="v5-state">${st==='helpful'?'🌸 Stratégie utile':st?'🍃 Stratégie déjà essayée':'📖 Une méthode à explorer'}</div>
  </section>
  <section class="v5-right" aria-label="Page ${p+1} sur 3" aria-live="polite">${ch[p]}</section>
 </div></div>
 <div class="v5-chapters" aria-label="Chapitres du grimoire">${names.map((n,i)=>`<button class="v5-tab" data-action="bookPage" data-page="${i}" ${i===p?'aria-current="step"':''}>${n}</button>`).join('')}</div>
 <div class="v5-nav"><button class="btn secondary" data-action="bookPage" data-page="${p-1}" ${p===0?'disabled':''}>← Page précédente</button><button class="btn" data-action="bookPage" data-page="${p+1}" ${p===2?'disabled':''}>Tourner la page →</button></div>
 <div class="v5-links"><button class="btn tertiary" data-action="cat" data-cat="${c.id}">← Autres situations</button><button class="btn tertiary" data-action="journal">📖 Mon carnet</button><button class="btn tertiary" data-action="home">🌳 L'arbre</button></div>`,'Ollie te guide à travers les chapitres du grimoire.');
}

function methodViewLegacy(){const c=catById(state.cat);if(!c||!c.stations[state.index])return homeView();const s=c.stations[state.index];const k=key(c.id,state.index);const st=status(c.id,state.index);const isFav=saved(c.id,state.index);const checkNote=state.check==='yes'?`Super ! Tu peux essayer l’action proposée puis appliquer les conseils ci-dessous.`:state.check==='no'?`${c.help} Tu peux ensuite reprendre le plan étape par étape.`:'';
 const actions=st==='helpful'?`<div class="leaf-earned" aria-live="polite"><span class="big-leaf">🌸</span><div><strong>Ta feuille a fleuri !</strong><br>Cette stratégie t’a aidé. Une fleur éclot sur la branche correspondante.</div></div>`:st==='needhelp'?`<div class="fallback" aria-live="polite"><h3>🦉 On essaie un autre chemin ?</h3><p>Essaie d’abord cette étape : <strong>${esc(c.help)}</strong></p><p>Tu peux consulter une autre situation de cette branche ou utiliser SOS pour demander une aide adaptée.</p><div class="btn-row"><button class="btn secondary" data-action="cat" data-cat="${c.id}">Autres pistes</button><button class="btn" data-action="cat" data-cat="stuck">🛟 SOS</button><button class="btn tertiary" data-action="feedback" data-value="helpful">Finalement, ça m’a aidé !</button></div></div>`:st==='tried'?`<div class="try-status" aria-live="polite"><strong>🍃 Une feuille pousse sur ton arbre : tu as essayé !</strong><p>Est-ce qu’elle t’a aidé à avancer ?</p><div class="btn-row"><button class="btn" data-action="feedback" data-value="helpful">🍃 Oui, ça m’a aidé</button><button class="btn secondary" data-action="feedback" data-value="needhelp">🦉 Pas encore, une autre piste</button></div></div>`:`<div class="btn-row"><button class="btn" data-action="feedback" data-value="tried">✓ J’ai essayé cette stratégie</button><button class="btn secondary" data-action="cat" data-cat="${c.id}">Explorer d’autres situations</button></div>`;
 return content(`${crumb(c,'Ma stratégie')}<div class="section-tag">${c.icon} ${esc(c.en)} · CHEMIN ${state.index+1} SUR ${c.stations.length}</div><div class="method-head"><div class="method-name"><h2>${esc(s.strategy)}</h2><p class="lead" style="margin-bottom:6px">${esc(s.q)}</p></div><button class="star-btn ${isFav?'active':''}" data-action="favorite" aria-pressed="${isFav}" title="Enregistrer dans mon carnet">${isFav?'★ Dans mon carnet':'☆ Garder dans mon carnet'}</button></div><div class="sep"></div><div class="one-action"><div class="action-ico">🌱</div><div><h3>Ton premier petit pas</h3><p>${esc(s.action)}</p></div></div><div class="section-tag">📜 LES ÉTAPES DE TA MÉTHODE</div><div class="method-steps">${s.tips.map((tip,i)=>`<div class="method-step"><span class="n">${i+1}</span><p>${esc(tip)}</p></div>`).join('')}</div><blockquote class="wisdom">“${esc(s.hint)}”</blockquote><div class="check-box"><div class="section-tag">🧭 UN PETIT POINT AVANT D’AVANCER</div><p class="question">${esc(c.check)}</p><div class="check-actions"><button class="btn ${state.check==='yes'?'':'secondary'}" data-action="check" data-value="yes" aria-pressed="${state.check==='yes'}">✓ Oui</button><button class="btn ${state.check==='no'?'':'secondary'}" data-action="check" data-value="no" aria-pressed="${state.check==='no'}">? Pas encore</button></div>${checkNote?`<div class="check-note" role="status">🦉 <span>${esc(checkNote)}</span></div>`:''}</div><div class="sep"></div><h3>As-tu testé cette piste ?</h3><p class="lead" style="margin-bottom:8px">Tu avances en essayant, pas en réussissant tout du premier coup.</p>${actions}${st?'<div class="btn-row"><button class="btn secondary" data-action="seeGrowth">🌳 Observer mon arbre grandir</button></div>':''}<div class="btn-row"><button class="btn tertiary" data-action="back">← Étape précédente</button><button class="btn tertiary" data-action="home">🌳 L’arbre</button></div>`,`Essaie d’abord le petit pas proposé. Tu peux revenir consulter la méthode quand tu veux.`)}
function journalView(){const s=stats();const all=[];DATA.forEach(c=>c.stations.forEach((it,i)=>all.push({c,it,i,k:key(c.id,i),status:status(c.id,i),saved:saved(c.id,i)})));const subset=all.filter(x=>state.filter==='all'?!!x.status||x.saved:state.filter==='tried'?!!x.status:state.filter==='saved'?x.saved:x.status==='helpful');const filters=[['all','Toutes'],['saved','Favoris'],['tried','Feuilles essayées'],['helpful','Stratégies utiles']];
 return content(`${crumb(null,'Mon carnet')}<div class="journal-head"><div><div class="section-tag">📖 MON CARNET DE STRATÉGIES</div><h2>My Strategy Book</h2></div><span class="ribbon">🌱 Chaque essai compte !</span></div><p class="lead">Retrouve les méthodes explorées, celles que tu as choisies et les stratégies qui t’ont aidé. Les feuilles représentent tes essais et les fleurs les méthodes qui t’ont aidé. Tout reste enregistré sur cet appareil.</p><div class="journal-stats"><div class="stat"><strong>${s.attempt}</strong><span>feuilles poussées / 24</span></div><div class="stat"><strong>${s.useful}</strong><span>fleurs · stratégies utiles</span></div><div class="stat"><strong>${s.fav}</strong><span>favoris</span></div></div><div class="tab-bar" aria-label="Filtrer les stratégies">${filters.map(([id,label])=>`<button class="tab ${state.filter===id?'active':''}" data-action="filter" data-filter="${id}" aria-pressed="${state.filter===id}">${label}</button>`).join('')}</div><div class="journal-list">${subset.length?subset.map(x=>`<div class="journal-item"><span class="ji-icon">${x.status==='helpful'?'🌸':x.status?'🍃':v6Crest(x.c.id,'small')}</span><div class="ji-text"><strong>${esc(x.it.strategy)}</strong><small>${esc(x.c.en)} · ${x.status==='helpful'?'Ça m’a aidé':x.status==='needhelp'?'À réessayer':x.status?'Essayée': 'Enregistrée'}</small></div><button data-action="method" data-cat="${x.c.id}" data-index="${x.i}">Ouvrir →</button></div>`).join(''):`<div class="empty-state"><span>📜</span><strong>Ton carnet attend ses premières découvertes.</strong><p>Explore une branche, essaie une stratégie ou ajoute-la à tes favoris : elle apparaîtra ici.</p></div>`}</div><div class="discovery"><strong>🦉 Le conseil d’Ollie</strong><br>Le but n’est pas de collectionner toutes les feuilles. Le plus important, c’est de savoir quelle stratégie choisir quand tu en as besoin.</div><div class="btn-row"><button class="btn" data-action="home">🌳 Explorer l’arbre</button><button class="btn secondary" data-action="back">← Revenir</button></div>`,`Ton carnet garde la trace des stratégies découvertes, pas de tes notes ou de tes devoirs.`)}
function render(){header();main.innerHTML=state.page==='home'?homeView():state.page==='category'?categoryView():state.page==='method'?methodView():journalView();main.setAttribute('aria-label',state.page==='home'?'Arbre des stratégies':state.page==='category'?'Situations':state.page==='method'?'Conseils et stratégie':'Carnet de stratégies');renderModal()}
function renderModal(){if(!state.settingsOpen){modalRoot.innerHTML='';return}modalRoot.innerHTML=`<div class="modal-wrap" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title"><button class="close" data-action="closeSettings" aria-label="Fermer les réglages">×</button><div class="section-tag">⚙️ PERSONNALISER L’AVENTURE</div><h2 id="settings-title">Réglages</h2><p>À ton rythme, dans ta forêt.</p><div class="settings-row"><label for="setting-sound">🔔 Sons doux des boutons</label><input id="setting-sound" type="checkbox" data-setting="sound" ${state.data.sound?'checked':''}></div><div class="settings-row"><label for="setting-motion">🍃 Réduire les animations</label><input id="setting-motion" type="checkbox" data-setting="reduced" ${state.data.reduced?'checked':''}></div><div class="settings-row"><div><b>Effacer mes progrès</b><br><small>Efface favoris et feuilles de cet appareil.</small></div><button class="danger" data-action="reset">Effacer</button></div><p class="myth">Aucun compte nécessaire. Les progrès sont sauvegardés uniquement dans ce navigateur.</p><button class="btn" data-action="closeSettings">Fermer</button></div></div>`;modalRoot.querySelector('.close').focus()}
function handleAction(button){const a=button.dataset.action;const id=button.dataset.cat;const i=Number(button.dataset.index);
 
 if(a==='wisdomPick'){const c=catById(id);if(c&&Number.isInteger(i)&&i>=0&&i<c.stations.length){state.wisdomDraft={cat:id,index:i};render();play()}}
 else if(a==='wisdomBack'){state.wisdomDraft=null;render();play()}
 else if(a==='wisdomExperience'){const d=state.wisdomDraft,level=button.dataset.value;if(d&&d.cat===id&&['start','trying','alternative'].includes(level)){state.data.diagnostic[id]={index:d.index,level};state.wisdomDraft=null;persist();render();play()}}
 else if(a==='wisdomQuiz'){const d=state.data.diagnostic[id],v=Number(button.dataset.value);if(d&&d.index===i&&Number.isInteger(v)&&v>=0&&v<=2){state.data.miniAnswers[key(id,i)]=v;persist();render();play()}}
 else if(a==='wisdomReset'){delete state.data.diagnostic[id];state.wisdomDraft=null;persist();render();play()}
 else if(a==='wisdomFromBook'){const c=catById(id);if(c?.stations[i]){state.data.diagnostic[id]=state.data.diagnostic[id]?.index===i?state.data.diagnostic[id]:{index:i,level:'start'};persist();navigate('category',id);play()}}
 else if(a==='bookPage'){const p=Number(button.dataset.page);if(Number.isInteger(p)&&p>=0&&p<=2){state.bookPage=p;render();play();const el=main.querySelector('.v5-title h2');if(el){el.setAttribute('tabindex','-1');el.focus({preventScroll:true})}}}
 else if(a==='ollieTip'){state.ollieHint++;render();play();const t=main.querySelector('[data-action="ollieTip"]');if(t)t.focus({preventScroll:true})}
 else if(a==='home'){home();play()}
 else if(a==='back'){back();play()}
 else if(a==='seeGrowth'){home();play();toast('🍃 Voici ton arbre vivant et ses nouvelles feuilles !')}
 else if(a==='dismissGrowth'){state.newestLeaf=null;render()}
 else if(a==='cat'){if(catById(id)){navigate('category',id);play()}}
 else if(a==='method'){if(catById(id)?.stations[i]){navigate('method',id,i);play()}}
 else if(a==='journal'){state.filter=button.dataset.filter||'all';navigate('journal');play()}
 else if(a==='filter'){state.filter=button.dataset.filter;render();play()}
 else if(a==='favorite'){const k=key(state.cat,state.index);if(saved(state.cat,state.index))state.data.saved=state.data.saved.filter(x=>x!==k);else state.data.saved.push(k);persist();render();play();toast(saved(state.cat,state.index)?'⭐ Stratégie ajoutée au carnet':'Stratégie retirée des favoris')}
 else if(a==='check'){state.check=button.dataset.value;state.ollieHint=0;render();play()}
 else if(a==='feedback'){state.ollieHint=0;const k=key(state.cat,state.index);const old=state.data.tried[k];state.data.tried[k]=button.dataset.value;if(!old||button.dataset.value==='helpful')state.newestLeaf=k;persist();render();play();if(button.dataset.value==='tried'&&!old){toast('🍃 Une feuille pousse sur ta branche !');owlMagic('leaf')}if(button.dataset.value==='helpful'){toast('🌸 La feuille de ta stratégie a fleuri !');owlMagic('flower')}}
 else if(a==='settings'){state.settingsOpen=true;renderModal();play()}
 else if(a==='closeSettings'){state.settingsOpen=false;renderModal()}
 else if(a==='reset'){if(window.confirm('Effacer toutes les feuilles essayées et tous les favoris enregistrés sur cet appareil ?')){state.data.saved=[];state.data.tried={};state.data.bookChecks={};state.data.bookNotes={};state.data.diagnostic={};state.data.miniAnswers={};state.wisdomDraft=null;state.newestLeaf=null;persist();state.settingsOpen=false;state.history=[];state.page='home';render();toast('Ton arbre est prêt pour un nouveau départ.')}}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b){ev.preventDefault();handleAction(b)}else if(ev.target.dataset.dismiss==='modal'){state.settingsOpen=false;renderModal()}});
document.addEventListener('change',ev=>{const setting=ev.target.dataset.setting;if(!setting)return;state.data[setting]=!!ev.target.checked;persist();document.body.classList.toggle('reduce-motion',state.data.reduced);toast(setting==='sound'?(state.data.sound?'Sons activés':'Sons désactivés'):'Préférence enregistrée');if(setting==='sound'&&state.data.sound)play()});
document.addEventListener('change',ev=>{const n=ev.target.dataset.v5Step;if(n===undefined||state.page!=='method')return;const i=Number(n),c=catById(state.cat);if(!c||!c.stations[state.index]||!Number.isInteger(i)||i<0||i>=c.stations[state.index].tips.length)return;const k=key(state.cat,state.index),old=state.data.bookChecks[k]||[];state.data.bookChecks[k]=ev.target.checked?[...new Set([...old,i])]:old.filter(x=>x!==i);persist();render();play();main.querySelector('[data-v5-step="'+i+'"]')?.focus({preventScroll:true})});
document.addEventListener('input',ev=>{if(!ev.target.matches('[data-v5-reflection]')||state.page!=='method')return;state.data.bookNotes[key(state.cat,state.index)]=ev.target.value.slice(0,300);persist()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.settingsOpen){state.settingsOpen=false;renderModal()}});
load();render();
})();

</script>
</body>
