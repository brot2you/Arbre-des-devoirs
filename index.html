<style>
  :root {
    --cream: #F6F1E7;
    --card: #FFFFFF;
    --ink: #2B2620;
    --ink-soft: #6B6459;
    --line-color: #C1502E;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }

  h1, h2, .display {
    font-family: 'Archivo', -apple-system, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  header {
    padding: 28px 20px 18px;
    max-width: 620px;
    margin: 0 auto;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .roundel {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 4px solid var(--ink);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }
  .roundel svg { width: 22px; height: 22px; }

  .brand-text { line-height: 1.1; }
  .brand-text .eyebrow {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  h1 { font-size: 25px; margin: 2px 0 0; }

  header p.sub {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 4px 0 0;
    max-width: 48ch;
  }
  header p.legend {
    color: var(--ink-soft);
    font-size: 12.5px;
    margin: 8px 0 0;
    max-width: 48ch;
    font-style: italic;
  }

  main { max-width: 620px; margin: 0 auto; padding: 4px 20px 20px; }

  /* ---- Trail (path already chosen) ---- */
  #trail { margin-bottom: 4px; }

  .trail-item { position: relative; padding-left: 30px; padding-bottom: 22px; }
  .trail-item::before {
    content: '';
    position: absolute;
    left: 9px; top: 22px; bottom: 0;
    width: 3px;
    background: repeating-linear-gradient(
      to bottom,
      var(--line-color) 0, var(--line-color) 6px,
      transparent 6px, transparent 11px
    );
  }
  .trail-item .node-dot {
    position: absolute;
    left: 0; top: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--line-color);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #fff;
  }
  .trail-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    box-shadow: 0 1px 2px rgba(43,38,32,0.05);
  }
  .trail-chip .chip-icon { font-size: 15px; }
  .trail-chip b { color: var(--ink); font-weight: 700; }

  /* ---- Active question card ---- */
  .qnode { position: relative; padding-left: 30px; }
  .qnode.has-parent::before {
    content: '';
    position: absolute;
    left: 9px; top: -22px; height: 22px;
    width: 3px;
    background: repeating-linear-gradient(
      to bottom,
      var(--line-color) 0, var(--line-color) 6px,
      transparent 6px, transparent 11px
    );
  }
  .qnode .node-dot {
    position: absolute;
    left: 0; top: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 3px solid var(--line-color);
    background: var(--cream);
  }

  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    box-shadow: 0 1px 3px rgba(43,38,32,0.08);
    animation: cardIn 0.35s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .qcard .qlabel {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--line-color);
    margin-bottom: 6px;
  }
  .qcard .qtext {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0 0 14px;
    line-height: 1.3;
  }

  .choice-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--cream);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 9px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .choice-btn:last-child { margin-bottom: 0; }
  .choice-btn:hover { transform: translateX(2px); }
  .choice-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .choice-btn .choice-icon {
    font-size: 19px;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .choice-btn .choice-text { flex: 1; }
  .choice-btn .choice-code {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: var(--card);
    border-radius: 6px;
    padding: 2px 6px;
    margin-left: 4px;
    flex-shrink: 0;
  }
  .choice-btn .choice-arrow { margin-left: 4px; color: var(--ink-soft); flex-shrink: 0; }

  /* ---- Leaf / result node ---- */
  .leaf {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 18px 18px;
    box-shadow: 0 1px 3px rgba(43,38,32,0.08);
    border: 2px dashed var(--line-color);
    animation: cardIn 0.35s ease;
  }
  .leaf .leaf-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--line-color);
    margin-bottom: 4px;
  }
  .leaf .strategie-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    font-style: italic;
    color: var(--ink);
    background: var(--cream);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 12px;
  }
  .leaf ul { margin: 0; padding-left: 20px; }
  .leaf li { margin-bottom: 9px; font-size: 15.5px; line-height: 1.45; }
  .leaf li::marker { color: var(--line-color); }

  .astuce {
    margin-top: 14px;
    padding: 11px 14px;
    background: var(--cream);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    border-left: 4px solid var(--line-color);
  }
  .astuce b { font-weight: 700; }

  /* ---- Controls ---- */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding-left: 30px;
  }
  .ctrl-btn {
    flex: 1;
    background: var(--card);
    border: none;
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(43,38,32,0.06);
  }
  .ctrl-btn:hover { background: #fff; }
  .ctrl-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .ctrl-btn.primary {
    background: var(--ink);
    color: var(--cream);
  }

  footer {
    max-width: 620px;
    margin: 30px auto 0;
    padding: 0 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    .qcard, .leaf { animation: none !important; }
    .choice-btn { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="roundel" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="6.5" r="4.5" fill="currentColor"/>
        <circle cx="7.5" cy="11" r="4" fill="currentColor"/>
        <circle cx="16.5" cy="11" r="4" fill="currentColor"/>
        <rect x="10.6" y="14" width="2.8" height="7.5" rx="1.2" fill="currentColor"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="eyebrow">English homework · collège</div>
      <h1>L'arbre des devoirs</h1>
    </div>
  </div>
  <p class="sub">Réponds aux questions les unes après les autres. Chaque choix te rapproche d'une stratégie et de conseils concrets pour avancer seul(e).</p>
  <p class="legend">Classé par activité langagière : CO, CE, EE, EOC, EOI, médiation — comme en cours.</p>
</header>

<main>
  <div id="trail"></div>
  <div id="active-node"></div>
  <div class="controls" id="controls" style="display:none;">
    <button class="ctrl-btn" id="back-btn" type="button">← Étape précédente</button>
    <button class="ctrl-btn primary" id="restart-btn" type="button">Recommencer</button>
  </div>
</main>

<footer>Un outil BROT2YOU</footer>

<script>
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("tree-data").textContent);
  var trailEl = document.getElementById("trail");
  var activeEl = document.getElementById("active-node");
  var controlsEl = document.getElementById("controls");
  var backBtn = document.getElementById("back-btn");
  var restartBtn = document.getElementById("restart-btn");

  var state = { lineId: null, stationIndex: null };

  function currentLine() {
    if (!state.lineId) return null;
    for (var i = 0; i < data.lines.length; i++) {
      if (data.lines[i].id === state.lineId) return data.lines[i];
    }
    return null;
  }

  function setRootColor(color) {
    document.documentElement.style.setProperty("--line-color", color || "#C1502E");
  }

  function buildTrail() {
    trailEl.innerHTML = "";
    var line = currentLine();
    var steps = [];

    if (line) {
      steps.push({ icon: line.icon, text: line.code + " · " + line.name, color: line.color });
    }
    if (line && state.stationIndex !== null && line.stations.length > 1) {
      var st = line.stations[state.stationIndex];
      steps.push({ icon: "→", text: st.q, color: line.color });
    }

    for (var i = 0; i < steps.length; i++) {
      var s = steps[i];
      var item = document.createElement("div");
      item.className = "trail-item";
      item.style.setProperty("--line-color", s.color);

      var dot = document.createElement("span");
      dot.className = "node-dot";
      dot.style.background = s.color;
      dot.textContent = "✓";

      var chip = document.createElement("span");
      chip.className = "trail-chip";
      var iconSpan = document.createElement("span");
      iconSpan.className = "chip-icon";
      iconSpan.textContent = s.icon;
      var textSpan = document.createElement("b");
      textSpan.textContent = s.text;
      chip.appendChild(iconSpan);
      chip.appendChild(textSpan);

      item.appendChild(dot);
      item.appendChild(chip);
      trailEl.appendChild(item);
    }
  }

  function render() {
    activeEl.innerHTML = "";
    var line = currentLine();

    if (!state.lineId) {
      setRootColor("#C1502E");
      buildTrail();
      renderRootQuestion();
      controlsEl.style.display = "none";
      return;
    }

    setRootColor(line.color);

    if (state.stationIndex === null) {
      if (line.stations.length === 1) {
        state.stationIndex = 0;
        render();
        return;
      }
      buildTrail();
      renderStationQuestion(line);
      controlsEl.style.display = "flex";
      return;
    }

    buildTrail();
    renderLeaf(line, line.stations[state.stationIndex]);
    controlsEl.style.display = "flex";
  }

  function renderRootQuestion() {
    var qnode = document.createElement("div");
    qnode.className = "qnode";

    var dot = document.createElement("span");
    dot.className = "node-dot";
    dot.style.borderColor = "#C1502E";

    var card = document.createElement("div");
    card.className = "qcard";

    var qlabel = document.createElement("div");
    qlabel.className = "qlabel";
    qlabel.textContent = "Étape 1";

    var qtext = document.createElement("p");
    qtext.className = "qtext";
    qtext.textContent = "Quelle activité langagière correspond à ton devoir ?";

    card.appendChild(qlabel);
    card.appendChild(qtext);

    for (var i = 0; i < data.lines.length; i++) {
      card.appendChild(buildChoiceButton(data.lines[i], (function (l) {
        return function () {
          state.lineId = l.id;
          state.stationIndex = null;
          render();
          window.scrollTo(0, document.body.scrollHeight);
        };
      })(data.lines[i])));
    }

    qnode.appendChild(dot);
    qnode.appendChild(card);
    activeEl.appendChild(qnode);
  }

  function renderStationQuestion(line) {
    var qnode = document.createElement("div");
    qnode.className = "qnode has-parent";

    var dot = document.createElement("span");
    dot.className = "node-dot";
    dot.style.borderColor = line.color;

    var card = document.createElement("div");
    card.className = "qcard";

    var qlabel = document.createElement("div");
    qlabel.className = "qlabel";
    qlabel.style.color = line.color;
    qlabel.textContent = "Étape 2";

    var qtext = document.createElement("p");
    qtext.className = "qtext";
    qtext.textContent = "Précise ta situation :";

    card.appendChild(qlabel);
    card.appendChild(qtext);

    for (var i = 0; i < line.stations.length; i++) {
      card.appendChild(buildChoiceButton({ icon: "→", name: line.stations[i].q, color: line.color }, (function (idx) {
        return function () {
          state.stationIndex = idx;
          render();
          window.scrollTo(0, document.body.scrollHeight);
        };
      })(i)));
    }

    qnode.appendChild(dot);
    qnode.appendChild(card);
    activeEl.appendChild(qnode);
  }

  function renderLeaf(line, station) {
    var qnode = document.createElement("div");
    qnode.className = "qnode has-parent";

    var dot = document.createElement("span");
    dot.className = "node-dot";
    dot.style.borderColor = line.color;
    dot.style.background = line.color;

    var leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.style.borderColor = line.color;

    var label = document.createElement("div");
    label.className = "leaf-label";
    label.style.color = line.color;
    label.textContent = "🏁 Ce que tu peux faire";
    leaf.appendChild(label);

    if (station.strategie) {
      var strat = document.createElement("div");
      strat.className = "strategie-badge";
      strat.textContent = "🎯 Stratégie : " + station.strategie;
      leaf.appendChild(strat);
    }

    var ul = document.createElement("ul");
    for (var j = 0; j < station.tips.length; j++) {
      var li = document.createElement("li");
      li.textContent = station.tips[j];
      ul.appendChild(li);
    }
    leaf.appendChild(ul);

    if (station.astuce) {
      var astuce = document.createElement("div");
      astuce.className = "astuce";
      astuce.style.borderLeftColor = line.color;
      var b = document.createElement("b");
      b.textContent = "Astuce — ";
      astuce.appendChild(b);
      astuce.appendChild(document.createTextNode(station.astuce));
      leaf.appendChild(astuce);
    }

    qnode.appendChild(dot);
    qnode.appendChild(leaf);
    activeEl.appendChild(qnode);
  }

  function buildChoiceButton(item, onClick) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";

    var iconSpan = document.createElement("span");
    iconSpan.className = "choice-icon";
    iconSpan.textContent = item.icon;

    var textSpan = document.createElement("span");
    textSpan.className = "choice-text";
    textSpan.textContent = item.name;

    btn.appendChild(iconSpan);
    btn.appendChild(textSpan);

    if (item.code) {
      var codeSpan = document.createElement("span");
      codeSpan.className = "choice-code";
      codeSpan.textContent = item.code;
      btn.appendChild(codeSpan);
    }

    var arrow = document.createElement("span");
    arrow.className = "choice-arrow";
    arrow.textContent = "›";
    arrow.setAttribute("aria-hidden", "true");
    btn.appendChild(arrow);

    btn.addEventListener("click", onClick);
    return btn;
  }

  backBtn.addEventListener("click", function () {
    var line = currentLine();
    if (state.stationIndex !== null) {
      if (line && line.stations.length === 1) {
        state.lineId = null;
        state.stationIndex = null;
      } else {
        state.stationIndex = null;
      }
    } else if (state.lineId !== null) {
      state.lineId = null;
    }
    render();
  });

  restartBtn.addEventListener("click", function () {
    state.lineId = null;
    state.stationIndex = null;
    render();
  });

  render();
})();
</script>

</body>
</html>
